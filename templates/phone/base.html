<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhoneTracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .glow-red {
            color: #ff4d4d;
            text-shadow: 0 0 6px #ff0000, 0 0 12px #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">📱 PhoneTracker</a>

            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-secondary small">Користувач: <b class="text-light">{{ user.username }}</b></span>
                    <a href="/admin/" class="btn btn-outline-light btn-sm">⚙️ Адмінка</a>
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Вийти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Увійти</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-black text-center text-secondary py-3 border-top border-secondary mt-auto">
        <small>&copy; PhoneTracker. Всі права захищено.</small>
    </footer>

</body>
</html>
